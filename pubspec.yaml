name: studylog_flutter
description: StudyLog - Profil Mahasiswa, catatan kuliah, dan Campus Report (offline-first)
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  http: ^1.6.0
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
